[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-digest"
version = "0.5.0"
description = "A configurable arXiv retriever, ranker, summarizer, and weekly report generator."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "arXiv Digest contributors" }]
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "openai>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6.0.2,<7",
  "streamlit>=1.50,<2",
  "typer>=0.12.3,<1",
  "tzdata>=2025.2",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21.1,<1",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0.12.20240808",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_digest"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not live'"
testpaths = ["tests"]
markers = ["live: uses the live arXiv API (excluded by default)"]

[tool.coverage.run]
branch = true
source = ["arxiv_digest"]

[tool.coverage.report]
show_missing = true
skip_covered = true
